<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TraktorPad">
  <meta name="theme-color" content="#0a0c0f">
  <title>TraktorPad</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <div class="brand">Traktor<span>Pad</span></div>

    <div class="status" id="status" data-state="offline">
      <span class="dot"></span><span id="status-text">Connecting</span>
    </div>

    <div class="master">
      <span class="label">Master</span>
      <span class="value" id="master-bpm">--.-</span>
      <span class="unit">BPM</span>
    </div>

    <div class="bar-actions">
      <div class="segmented" role="group" aria-label="Waveform zoom">
        <button type="button" id="zoom-out" aria-label="Zoom out">&#8722;</button>
        <span class="zoom-value" id="zoom-value"></span>
        <button type="button" id="zoom-in" aria-label="Zoom in">+</button>
      </div>
      <button type="button" class="lock" id="lock" aria-pressed="false">
        <span class="lock-icon" aria-hidden="true"></span><span id="lock-text">Touch on</span>
      </button>
    </div>
  </header>

  <main class="decks" id="decks"></main>

  <section class="browser" id="browser">
    <div class="browser-head">
      <button type="button" class="tool back" id="back" aria-label="Back">&#8249;</button>
      <div class="crumbs" id="crumbs"></div>
      <div class="count" id="count"></div>
      <div class="actions">
        <button type="button" class="tool load" data-load="1"><b>A</b><span>Load</span></button>
        <button type="button" class="tool load" data-load="2"><b>B</b><span>Load</span></button>
        <button type="button" class="tool" id="preview">Preview</button>
        <button type="button" class="tool" id="prep">+ Prep</button>
      </div>
    </div>

    <div class="preview" id="preview-strip" hidden>
      <button type="button" class="tool" id="preview-toggle">Play / Pause</button>
      <div class="preview-bar" id="preview-bar"><div class="preview-fill" id="preview-fill"></div></div>
      <div class="preview-time" id="preview-time"></div>
      <button type="button" class="tool load" data-from-preview="1"><b>A</b><span>Load</span></button>
      <button type="button" class="tool load" data-from-preview="2"><b>B</b><span>Load</span></button>
      <button type="button" class="tool" id="preview-close" aria-label="Close preview">&#10005;</button>
    </div>

    <div class="columns" id="columns">
      <button type="button" class="col deckcol" data-sort="0">#</button>
      <button type="button" class="col" data-sort="2">Title</button>
      <button type="button" class="col" data-sort="3">Artist</button>
      <button type="button" class="col num" data-sort="5">BPM</button>
      <button type="button" class="col num" data-sort="28">Key</button>
      <button type="button" class="col num" data-sort="22">Rating</button>
    </div>

    <div class="list" id="list">
      <div class="list-space" id="list-space"></div>
      <div class="list-rows" id="list-rows"></div>
    </div>
    <div class="browser-note" id="browser-note" hidden></div>
  </section>

  <template id="deck-template">
    <section class="deck">
      <div class="info">
        <div class="deck-head">
          <div class="letter"></div>
          <div class="track">
            <div class="title"></div>
            <div class="artist"></div>
          </div>
        </div>
        <div class="readout">
          <div class="stat bpm">
            <span class="num"></span>
            <span class="sub"></span>
          </div>
          <div class="stat key">
            <span class="num"></span>
            <span class="sub">Key</span>
          </div>
        </div>
        <div class="phase" aria-label="Sync phase">
          <div class="phase-fill"></div>
          <div class="phase-centre"></div>
          <span class="phase-label"></span>
        </div>
      </div>

      <div class="waves">
        <div class="scroll">
          <canvas class="scroll-canvas"></canvas>
          <div class="wave-note"></div>
        </div>
        <div class="overview">
          <canvas class="overview-canvas"></canvas>
          <div class="seek-hint">Hold to seek a live deck</div>
        </div>
      </div>

      <div class="times">
        <div class="stat remain"><span class="num"></span><span class="sub">Remaining</span></div>
        <div class="stat elapsed"><span class="num"></span><span class="sub">Elapsed</span></div>
        <div class="beats">
          <div><span class="beat-now"></span><span class="sub">Bar . beat</span></div>
          <div><span class="beat-left"></span><span class="sub">Bars left</span></div>
        </div>
        <div class="badges">
          <span class="badge live">Live</span>
          <span class="badge master-badge">Master</span>
          <span class="badge sync-badge">Sync</span>
          <span class="badge loop-badge">Loop</span>
        </div>
      </div>
    </section>
  </template>

  <script src="wave.js"></script>
  <script src="app.js"></script>
</body>
</html>
