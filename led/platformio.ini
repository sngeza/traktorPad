; PlatformIO build for the LED panel sketch. The sketch stays in
; traktorpad_led/ so it still opens in the Arduino IDE.
;
;   cd led
;   pio run -e nano -t upload          ; or pro_micro, nano_oldbootloader, uno, esp32
;   pio device monitor                 ; not needed: traktorpad.py talks to it

[platformio]
src_dir = traktorpad_led
default_envs = nano

[env]
framework = arduino
lib_deps = fastled/FastLED@^3.7.0
monitor_speed = 1000000

[env:nano]
platform = atmelavr
board = nanoatmega328new

[env:nano_oldbootloader]
platform = atmelavr
board = nanoatmega328

[env:uno]
platform = atmelavr
board = uno

[env:pro_micro]
platform = atmelavr
board = sparkfun_promicro16

[env:esp32]
platform = espressif32
board = esp32dev
build_flags = -DDATA_PIN=16
